(function () {

  var T = {
    en: {

      subtitle: 'Everything you need to know about using ArgumentCoach, and how to reach us.',
      tab_terms: 'Terms of Use', tab_privacy: 'Privacy Policy', tab_support: 'Support',
      status: 'In progress', will_cover: 'Will cover',
      terms_h: 'Terms of Use', terms_p: 'The full Terms of Use will be published here before the app is released.',
      terms_1: 'Using the app and who it is for', terms_2: 'Subscriptions, trial and billing through the App Store',
      terms_3: 'Not therapy or professional advice', terms_4: 'Acceptable use', terms_5: 'Changes to these terms',
      privacy_h: 'Privacy Policy', privacy_p: 'The full Privacy Policy will be published here before the app is released.',
      privacy_1: 'What is stored on your device', privacy_2: 'What is sent to our AI provider to generate answers',
      privacy_3: 'Voice features and speech recognition', privacy_4: 'Deleting your data', privacy_5: 'Contact for privacy questions',
      support_h: 'Support', support_p: 'Help and contact details will appear here before the app is released.',
      contact: 'Contact', contact_val: 'E-mail address: in progress', faq: 'Frequently asked questions',
      faq_1: 'How do I restore my purchases?', faq_2: 'How do I delete my data?', faq_3: 'How do I cancel my subscription?',
      soon: 'Answer coming soon.', footer: 'ArgumentCoach – Hard Talk Trainer',
      updated: "Last updated: 20 November 2026",
      terms_doc: "<h3>1. About ArgumentCoach</h3><p>ArgumentCoach (\"the app\", \"we\") is an iOS app by Michał Karczewski (Poland) that helps you prepare for difficult conversations: you talk the situation through, get a conversation plan, practise it in a role-play where AI plays the other person, and review how it went. Replies are generated by AI (Anthropic's Claude). By using the app you accept these terms.</p><h3>2. Who the app is for</h3><p>The app is intended for adults (18+). If you are younger, use it only together with a parent or guardian.</p><h3>3. Not therapy or professional advice</h3><p>ArgumentCoach is a self-help and practice tool. It is <strong>not</strong> therapy, medical, legal or financial advice, and AI can be wrong. Treat suggestions as ideas, not instructions. If you are in danger or in crisis, call your local emergency number (112 in the EU) or a crisis line right away; the app shows helpline numbers when it detects a crisis.</p><h3>4. Free plan and Premium</h3><ul><li><strong>Free:</strong> one full cycle (one situation) with limited messages, no account needed.</li><li><strong>Premium:</strong> monthly or yearly auto-renewing subscription (US$4.99 per month or US$39.99 per year; prices may differ by country and include applicable taxes). It unlocks unlimited situations, voice features and all topics. There is no free trial: you pay for the period when you confirm the purchase.</li><li>Payment is charged to your Apple ID. The subscription renews automatically unless you cancel at least 24 hours before the end of the current period. Manage or cancel it in iOS Settings → your name → Subscriptions.</li><li>Refunds are handled by Apple (reportaproblem.apple.com), in line with Apple's rules and your statutory rights.</li><li>To keep the service fair and affordable, Premium has a generous daily message limit.</li></ul><h3>5. Acceptable use</h3><ul><li>Do not use the app for anything unlawful, to plan harm to yourself or others, or to harass anyone.</li><li>Do not try to bypass limits, abuse or overload the service, or reverse-engineer it.</li><li>Do not share your subscription in ways Apple's rules do not allow.</li></ul><h3>6. Your content</h3><p>What you write stays yours. You allow us to process it only to provide the app (including sending it to our AI provider to generate replies, see the Privacy Policy). Please do not enter sensitive details about other people.</p><h3>7. Availability and liability</h3><p>We work to keep the app running, but it is provided \"as is\" and may change or be unavailable at times. To the extent the law allows, we are not liable for decisions you make based on AI output. Nothing here limits your mandatory consumer rights or liability that cannot be excluded by law.</p><h3>8. Apple, governing law, changes</h3><p>Apple's <a href=\"https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\" target=\"_blank\" rel=\"noopener\">Standard EULA</a> also applies. These terms are governed by Polish law, without depriving you of consumer protections of your country of residence. We may update these terms; the date above shows the latest version, and material changes will be announced in the app or here.</p><h3>9. Contact</h3><p>Questions: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      privacy_doc: "<h3>Summary</h3><ul><li>No account, no ads, no tracking, no analytics SDKs, and we never sell data.</li><li>Your situations, chats, plans and reports are stored on your device.</li><li>To generate a reply, the text you send is processed by our AI provider (Anthropic) through our proxy (Cloudflare). We do not keep your conversations on a server.</li></ul><h3>1. Who is responsible</h3><p>Michał Karczewski, Poland. Contact: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><h3>2. Stored on your device</h3><p>Situations, conversation history, plans, reports, settings and a small snapshot for the home-screen widget are stored locally in the app (and in your device backups according to your iOS settings). We cannot access them. You can delete a situation in the app or delete the app to remove everything.</p><h3>3. What leaves your device</h3><p>When you use the AI features, the app sends the following to our proxy, which forwards it to Anthropic's API:</p><ul><li>the messages you write and the earlier messages of that conversation,</li><li>the details you entered about the situation (e.g. description, who it is about, topic) and our instructions to the AI,</li><li>your language and the app version.</li></ul><p>The proxy also receives a <strong>random device ID</strong> (generated by the app, kept in the iOS Keychain, not linked to your name or Apple ID) used to enforce the free-plan limit, and, for subscribers, Apple's signed subscription transaction, which we verify to unlock Premium (it contains the product and a transaction number, no payment details).</p><p>The proxy stores only counters (number of requests per random ID: up to about 400 days for the free-plan limit, 2 days for Premium daily limits). It does not store message content. Cloudflare, which hosts the proxy, may process technical request data such as IP address to operate the service.</p><p>If you use the contact form, your name, e-mail address and message are sent to us through the form provider Formspree (USA) and are used only to answer you.</p><h3>4. AI provider</h3><p>Anthropic processes your content to generate replies, as our processor under its commercial terms, which state that API content is not used to train its models. It may keep data for a limited period for safety and abuse prevention. See <a href=\"https://www.anthropic.com/privacy\" target=\"_blank\" rel=\"noopener\">anthropic.com/privacy</a>. Anthropic and Cloudflare operate in the USA; transfers rely on safeguards such as Standard Contractual Clauses or the EU–US Data Privacy Framework.</p><h3>5. Voice, calendar, notifications</h3><ul><li><strong>Voice (Premium):</strong> speech-to-text uses Apple's Speech framework (on your device or Apple's servers, depending on language and device); spoken replies are generated on your device. The microphone is used only while you record. We receive only the resulting text if you send it.</li><li><strong>Calendar:</strong> if you ask for it, a short event is added (write-only access). <strong>Notifications:</strong> reminders are scheduled locally on your device.</li><li><strong>On-device AI:</strong> where available, hints may be generated by Apple's on-device model, without leaving your device.</li></ul><h3>6. Purchases</h3><p>Payments are processed by Apple. We never see your card or payment details.</p><h3>7. Legal basis (GDPR)</h3><p>Performing the service you requested (Art. 6(1)(b)) and our legitimate interest in keeping the service secure and preventing abuse of limits (Art. 6(1)(f)). Conversations may contain personal details you choose to enter; please avoid sensitive data about third parties.</p><h3>8. Your rights</h3><p>You can request access, correction, deletion, portability or object to processing, and you may complain to your data protection authority (in Poland: UODO). Since we hold no account data, most of your data is under your control on your device. Server counters are tied only to a random ID, so to delete them contact us and we will help where technically possible.</p><h3>9. Children</h3><p>The app is not intended for people under 18 and we do not knowingly collect their data.</p><h3>10. Changes and contact</h3><p>We will update this policy when the app changes; the date above shows the latest version. Questions: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      support_doc: "<p>We are happy to help. We aim to reply within a few business days.</p><form class=\"contact-form\" action=\"https://formspree.io/f/xwvyljvj\" method=\"POST\"><input type=\"hidden\" name=\"_subject\" value=\"[ArgumentCoach] Support\"><input type=\"hidden\" name=\"app\" value=\"ArgumentCoach\"><input type=\"hidden\" name=\"_language\" value=\"en\"><input type=\"text\" name=\"_gotcha\" tabindex=\"-1\" autocomplete=\"off\" style=\"display:none\"><label>Your name<input type=\"text\" name=\"name\" required autocomplete=\"name\"></label><label>Email address<input type=\"email\" name=\"email\" required autocomplete=\"email\"></label><label>Topic<select name=\"topic\" required><option value=\"\" disabled selected>Select a topic…</option><option value=\"Subscription & billing\">Subscription & billing</option><option value=\"Technical issue\">Technical issue</option><option value=\"Privacy & data\">Privacy & data</option><option value=\"Feedback & suggestions\">Feedback & suggestions</option><option value=\"Other\">Other</option></select></label><label>Message<textarea name=\"message\" rows=\"5\" required></textarea></label><button type=\"submit\" class=\"submit-btn\">Send message →</button><p class=\"form-err\" hidden>Something went wrong. Please try again or write to us by e-mail.</p></form><p class=\"form-ok\" hidden>Message sent! Thank you, we will get back to you within a few business days.</p><p class=\"form-note\">Or write directly: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><div class=\"label\">Frequently asked questions</div><details><summary>How do I restore my purchases?</summary><p>Open Settings in the app and tap \"Restore purchases\" (also available on the Premium screen). Use the same Apple ID you bought with.</p></details><details><summary>How do I cancel my subscription?</summary><p>On your iPhone: Settings → your name → Subscriptions → ArgumentCoach → Cancel. You keep Premium until the end of the paid period.</p></details><details><summary>How do I get a refund?</summary><p>Refunds are handled by Apple: go to reportaproblem.apple.com, sign in and choose the purchase.</p></details><details><summary>How do I delete my data?</summary><p>Delete a situation in the app, or delete the app to remove all data stored on your device. For questions about server-side counters, contact us.</p></details><details><summary>Why did I reach the free limit?</summary><p>The Free plan covers one full cycle (one situation) with a limited number of messages. Premium removes these limits.</p></details><details><summary>The app shows an error or does not answer</summary><p>Check your internet connection and update the app to the latest version in the App Store. If it persists, write to us with a short description.</p></details><details><summary>The AI answered in another language</summary><p>It replies in the language of your last message. Write in the language you want to get back.</p></details><details><summary>I am in crisis</summary><p>ArgumentCoach is not a crisis service. Call your local emergency number (112 in the EU) or a crisis line right away. In Poland: 116 123 (adults), 116 111 (children and teens).</p></details>",

      terms_doc: "<h3>1. About ArgumentCoach</h3><p>ArgumentCoach (\"the app\", \"we\") is an iOS app by Michał Karczewski (Poland) that helps you prepare for difficult conversations: you talk the situation through, get a conversation plan, practise it in a role-play where AI plays the other person, and review how it went. Replies are generated by AI (Anthropic's Claude). By using the app you accept these terms.</p><h3>2. Who the app is for</h3><p>The app is intended for adults (18+). If you are younger, use it only together with a parent or guardian.</p><h3>3. Not therapy or professional advice</h3><p>ArgumentCoach is a self-help and practice tool. It is <strong>not</strong> therapy, medical, legal or financial advice, and AI can be wrong. Treat suggestions as ideas, not instructions. If you are in danger or in crisis, call your local emergency number (112 in the EU) or a crisis line right away; the app shows helpline numbers when it detects a crisis.</p><h3>4. Free plan and Premium</h3><ul><li><strong>Free:</strong> one full cycle (one situation) with limited messages, no account needed.</li><li><strong>Premium:</strong> monthly or yearly auto-renewing subscription (US$4.99 per month or US$39.99 per year; prices may differ by country and include applicable taxes). It unlocks unlimited situations, voice features and all topics. There is no free trial: you pay for the period when you confirm the purchase.</li><li>Payment is charged to your Apple ID. The subscription renews automatically unless you cancel at least 24 hours before the end of the current period. Manage or cancel it in iOS Settings → your name → Subscriptions.</li><li>Refunds are handled by Apple (reportaproblem.apple.com), in line with Apple's rules and your statutory rights.</li><li>To keep the service fair and affordable, Premium has a generous daily message limit.</li></ul><h3>5. Acceptable use</h3><ul><li>Do not use the app for anything unlawful, to plan harm to yourself or others, or to harass anyone.</li><li>Do not try to bypass limits, abuse or overload the service, or reverse-engineer it.</li><li>Do not share your subscription in ways Apple's rules do not allow.</li></ul><h3>6. Your content</h3><p>What you write stays yours. You allow us to process it only to provide the app (including sending it to our AI provider to generate replies, see the Privacy Policy). Please do not enter sensitive details about other people.</p><h3>7. Availability and liability</h3><p>We work to keep the app running, but it is provided \"as is\" and may change or be unavailable at times. To the extent the law allows, we are not liable for decisions you make based on AI output. Nothing here limits your mandatory consumer rights or liability that cannot be excluded by law.</p><h3>8. Apple, governing law, changes</h3><p>Apple's <a href=\"https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\" target=\"_blank\" rel=\"noopener\">Standard EULA</a> also applies. These terms are governed by Polish law, without depriving you of consumer protections of your country of residence. We may update these terms; the date above shows the latest version, and material changes will be announced in the app or here.</p><h3>9. Contact</h3><p>Michał Karczewski, PL9442203727. Questions: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",

      terms_doc: "<h3>1. O aplikacji</h3><p>ArgumentCoach („aplikacja”, „my”) to aplikacja na iOS autorstwa Michała Karczewskiego (Polska), która pomaga przygotować się do trudnych rozmów: omawiasz sytuację, dostajesz plan rozmowy, ćwiczysz go w scenariuszu, w którym AI gra drugą stronę, i analizujesz, jak poszło. Odpowiedzi generuje sztuczna inteligencja (Claude firmy Anthropic). Korzystając z aplikacji, akceptujesz ten regulamin.</p><h3>2. Dla kogo jest aplikacja</h3><p>Aplikacja jest przeznaczona dla osób dorosłych (18+). Osoby młodsze mogą z niej korzystać wyłącznie wraz z rodzicem lub opiekunem.</p><h3>3. To nie terapia ani profesjonalna porada</h3><p>ArgumentCoach to narzędzie do samopomocy i ćwiczeń. To <strong>nie</strong> jest terapia ani porada medyczna, prawna czy finansowa, a AI może się mylić. Traktuj podpowiedzi jak pomysły, nie polecenia. Jeśli jesteś w niebezpieczeństwie lub kryzysie, natychmiast zadzwoń pod lokalny numer alarmowy (112) lub na telefon zaufania; aplikacja pokazuje numery pomocy, gdy wykryje kryzys.</p><h3>4. Plan darmowy i Premium</h3><ul><li><strong>Darmowy:</strong> jeden pełny cykl (jedna sytuacja) z ograniczoną liczbą wiadomości, bez konta.</li><li><strong>Premium:</strong> subskrypcja miesięczna lub roczna z automatycznym odnawianiem (4,99 USD miesięcznie lub 39,99 USD rocznie; ceny mogą się różnić w zależności od kraju i zawierają obowiązujące podatki). Odblokowuje nielimitowane sytuacje, funkcje głosowe i wszystkie tematy. Nie ma darmowego okresu próbnego: płacisz za okres w chwili potwierdzenia zakupu.</li><li>Płatność jest pobierana z Twojego Apple ID. Subskrypcja odnawia się automatycznie, chyba że anulujesz ją co najmniej 24 godziny przed końcem bieżącego okresu. Zarządzasz nią lub anulujesz w Ustawieniach iOS → Twoje imię → Subskrypcje.</li><li>Zwroty obsługuje Apple (reportaproblem.apple.com), zgodnie z zasadami Apple i Twoimi ustawowymi prawami.</li><li>Aby usługa była uczciwa i dostępna cenowo, Premium ma hojny dzienny limit wiadomości.</li></ul><h3>5. Zasady korzystania</h3><ul><li>Nie używaj aplikacji do celów niezgodnych z prawem, do planowania krzywdy siebie lub innych ani do nękania kogokolwiek.</li><li>Nie próbuj obchodzić limitów, nadużywać ani przeciążać usługi ani jej dekompilować.</li><li>Nie udostępniaj subskrypcji w sposób niezgodny z zasadami Apple.</li></ul><h3>6. Twoje treści</h3><p>To, co piszesz, pozostaje Twoje. Zezwalasz nam przetwarzać to wyłącznie w celu działania aplikacji (w tym przekazać dostawcy AI w celu wygenerowania odpowiedzi, patrz Polityka prywatności). Prosimy, nie wpisuj wrażliwych danych innych osób.</p><h3>7. Dostępność i odpowiedzialność</h3><p>Dbamy o działanie aplikacji, ale jest udostępniana „tak jak jest” i może się zmieniać lub bywać niedostępna. W granicach prawa nie odpowiadamy za decyzje podjęte na podstawie odpowiedzi AI. Żadne postanowienie nie ogranicza Twoich bezwzględnie obowiązujących praw konsumenta ani odpowiedzialności, której nie można wyłączyć.</p><h3>8. Apple, prawo właściwe, zmiany</h3><p>Zastosowanie ma także <a href=\"https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\" target=\"_blank\" rel=\"noopener\">Standardowa Umowa Licencyjna Apple (EULA)</a>. Regulamin podlega prawu polskiemu, bez pozbawiania Cię ochrony konsumenckiej obowiązującej w kraju Twojego zamieszkania. Możemy aktualizować regulamin; data powyżej wskazuje najnowszą wersję, a istotne zmiany ogłosimy w aplikacji lub tutaj.</p><h3>9. Kontakt</h3><p>Pytania: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      privacy_doc: "<h3>W skrócie</h3><ul><li>Bez konta, reklam, śledzenia i SDK analitycznych; niczego nie sprzedajemy.</li><li>Twoje sytuacje, rozmowy, plany i raporty są przechowywane na Twoim urządzeniu.</li><li>Aby wygenerować odpowiedź, wysyłany tekst jest przetwarzany przez dostawcę AI (Anthropic) za pośrednictwem naszego serwera pośredniczącego (Cloudflare). Nie przechowujemy Twoich rozmów na serwerze.</li></ul><h3>1. Administrator</h3><p>Michał Karczewski, Polska. Kontakt: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><h3>2. Dane na Twoim urządzeniu</h3><p>Sytuacje, historia rozmów, plany, raporty, ustawienia i niewielka migawka dla widżetu na ekranie głównym są przechowywane lokalnie w aplikacji (oraz w kopiach zapasowych urządzenia zgodnie z ustawieniami iOS). Nie mamy do nich dostępu. Możesz usunąć sytuację w aplikacji albo usunąć aplikację, aby skasować wszystko.</p><h3>3. Co opuszcza Twoje urządzenie</h3><p>Gdy korzystasz z funkcji AI, aplikacja wysyła do naszego serwera pośredniczącego, który przekazuje to do API Anthropic:</p><ul><li>wiadomości, które piszesz, oraz wcześniejsze wiadomości tej rozmowy,</li><li>dane, które podajesz o sytuacji (np. opis, kogo dotyczy, temat) oraz nasze instrukcje dla AI,</li><li>język i wersję aplikacji.</li></ul><p>Serwer otrzymuje też <strong>losowy identyfikator urządzenia</strong> (generowany przez aplikację, przechowywany w Pęku kluczy iOS, niepowiązany z Twoim imieniem ani Apple ID), używany do egzekwowania limitu planu darmowego, a dla subskrybentów podpisaną przez Apple transakcję subskrypcji, którą weryfikujemy, by odblokować Premium (zawiera produkt i numer transakcji, bez danych płatniczych).</p><p>Serwer zapisuje wyłącznie liczniki (liczba zapytań na losowy identyfikator: do ok. 400 dni dla limitu planu darmowego, 2 dni dla dziennych limitów Premium). Nie zapisuje treści wiadomości. Cloudflare, który hostuje serwer, może przetwarzać techniczne dane żądań, takie jak adres IP, aby świadczyć usługę.</p><p>Jeśli korzystasz z formularza kontaktowego, Twoje imię, adres e-mail i wiadomość trafiają do nas przez dostawcę formularzy Formspree (USA) i służą wyłącznie do udzielenia odpowiedzi.</p><h3>4. Dostawca AI</h3><p>Anthropic przetwarza Twoje treści, aby generować odpowiedzi, jako nasz podmiot przetwarzający na podstawie warunków komercyjnych, z których wynika, że treści z API nie służą do trenowania jego modeli. Może przechowywać dane przez ograniczony czas w celu bezpieczeństwa i zapobiegania nadużyciom. Zobacz <a href=\"https://www.anthropic.com/privacy\" target=\"_blank\" rel=\"noopener\">anthropic.com/privacy</a>. Anthropic i Cloudflare działają w USA; transfery opierają się na zabezpieczeniach takich jak standardowe klauzule umowne lub EU–US Data Privacy Framework.</p><h3>5. Głos, kalendarz, powiadomienia</h3><ul><li><strong>Głos (Premium):</strong> zamiana mowy na tekst korzysta z Apple Speech (na urządzeniu lub na serwerach Apple, zależnie od języka i urządzenia); odpowiedzi głosowe generowane są na urządzeniu. Mikrofon działa tylko podczas nagrywania. Do nas trafia wyłącznie tekst, jeśli go wyślesz.</li><li><strong>Kalendarz:</strong> na Twoją prośbę dodawane jest krótkie wydarzenie (dostęp tylko do zapisu). <strong>Powiadomienia:</strong> przypomnienia są planowane lokalnie na urządzeniu.</li><li><strong>AI na urządzeniu:</strong> tam, gdzie jest dostępne, podpowiedzi może generować model Apple działający na urządzeniu, bez wysyłania danych.</li></ul><h3>6. Zakupy</h3><p>Płatności przetwarza Apple. Nigdy nie widzimy danych Twojej karty ani płatności.</p><h3>7. Podstawa prawna (RODO)</h3><p>Realizacja usługi, o którą prosisz (art. 6 ust. 1 lit. b) oraz nasz prawnie uzasadniony interes w zapewnieniu bezpieczeństwa usługi i zapobieganiu nadużywaniu limitów (art. 6 ust. 1 lit. f). Rozmowy mogą zawierać dane osobowe, które sam wpisujesz; prosimy, unikaj wrażliwych danych osób trzecich.</p><h3>8. Twoje prawa</h3><p>Możesz żądać dostępu, sprostowania, usunięcia, przenoszenia danych lub sprzeciwić się przetwarzaniu, a także złożyć skargę do organu ochrony danych (w Polsce: UODO). Ponieważ nie prowadzimy kont, większość Twoich danych jest pod Twoją kontrolą na urządzeniu. Liczniki na serwerze są powiązane tylko z losowym identyfikatorem, więc aby je usunąć, napisz do nas, a pomożemy, o ile to technicznie możliwe.</p><h3>9. Dzieci</h3><p>Aplikacja nie jest przeznaczona dla osób poniżej 18. roku życia i świadomie nie zbieramy ich danych.</p><h3>10. Zmiany i kontakt</h3><p>Politykę zaktualizujemy, gdy zmieni się aplikacja; data powyżej wskazuje najnowszą wersję. Pytania: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      support_doc: "<p>Chętnie pomożemy. Staramy się odpowiadać w ciągu kilku dni roboczych.</p><form class=\"contact-form\" action=\"https://formspree.io/f/xwvyljvj\" method=\"POST\"><input type=\"hidden\" name=\"_subject\" value=\"[ArgumentCoach] Support\"><input type=\"hidden\" name=\"app\" value=\"ArgumentCoach\"><input type=\"hidden\" name=\"_language\" value=\"pl\"><input type=\"text\" name=\"_gotcha\" tabindex=\"-1\" autocomplete=\"off\" style=\"display:none\"><label>Imię<input type=\"text\" name=\"name\" required autocomplete=\"name\"></label><label>Adres e-mail<input type=\"email\" name=\"email\" required autocomplete=\"email\"></label><label>Temat<select name=\"topic\" required><option value=\"\" disabled selected>Wybierz temat…</option><option value=\"Subskrypcja i płatności\">Subskrypcja i płatności</option><option value=\"Problem techniczny\">Problem techniczny</option><option value=\"Prywatność i dane\">Prywatność i dane</option><option value=\"Opinia i sugestie\">Opinia i sugestie</option><option value=\"Inne\">Inne</option></select></label><label>Wiadomość<textarea name=\"message\" rows=\"5\" required></textarea></label><button type=\"submit\" class=\"submit-btn\">Wyślij wiadomość →</button><p class=\"form-err\" hidden>Coś poszło nie tak. Spróbuj ponownie lub napisz do nas e-mailem.</p></form><p class=\"form-ok\" hidden>Wiadomość wysłana! Dziękujemy, odpowiemy w ciągu kilku dni roboczych.</p><p class=\"form-note\">Albo napisz bezpośrednio: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><div class=\"label\">Najczęstsze pytania</div><details><summary>Jak przywrócić zakupy?</summary><p>Otwórz Ustawienia w aplikacji i stuknij „Przywróć zakupy” (jest też na ekranie Premium). Użyj tego samego Apple ID, którym kupowano subskrypcję.</p></details><details><summary>Jak anulować subskrypcję?</summary><p>Na iPhonie: Ustawienia → Twoje imię → Subskrypcje → ArgumentCoach → Anuluj. Premium zachowujesz do końca opłaconego okresu.</p></details><details><summary>Jak uzyskać zwrot pieniędzy?</summary><p>Zwroty obsługuje Apple: wejdź na reportaproblem.apple.com, zaloguj się i wybierz zakup.</p></details><details><summary>Jak usunąć moje dane?</summary><p>Usuń sytuację w aplikacji albo usuń aplikację, aby skasować wszystkie dane na urządzeniu. W sprawie liczników na serwerze napisz do nas.</p></details><details><summary>Dlaczego osiągnięto limit planu darmowego?</summary><p>Plan darmowy obejmuje jeden pełny cykl (jedną sytuację) z ograniczoną liczbą wiadomości. Premium znosi te limity.</p></details><details><summary>Aplikacja pokazuje błąd albo nie odpowiada</summary><p>Sprawdź połączenie z internetem i zaktualizuj aplikację do najnowszej wersji w App Store. Jeśli problem nie znika, napisz do nas krótki opis.</p></details><details><summary>AI odpowiedziało w innym języku</summary><p>Odpowiada w języku Twojej ostatniej wiadomości. Pisz w języku, w którym chcesz dostać odpowiedź.</p></details><details><summary>Jestem w kryzysie</summary><p>ArgumentCoach nie jest usługą kryzysową. Natychmiast zadzwoń pod numer alarmowy 112 lub na telefon zaufania. W Polsce: 116 123 (dorośli), 116 111 (dzieci i młodzież).</p></details>",

      privacy_doc: "<h3>W skrócie</h3><ul><li>Bez konta, reklam, śledzenia i SDK analitycznych; niczego nie sprzedajemy.</li><li>Twoje sytuacje, rozmowy, plany i raporty są przechowywane na Twoim urządzeniu.</li><li>Aby wygenerować odpowiedź, wysyłany tekst jest przetwarzany przez dostawcę AI (Anthropic) za pośrednictwem naszego serwera pośredniczącego (Cloudflare). Nie przechowujemy Twoich rozmów na serwerze.</li></ul><h3>1. Administrator</h3><p>Michał Karczewski (jednoosobowa działalność gospodarcza), Polska, NIP: PL9442203727. Kontakt: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><h3>2. Dane na Twoim urządzeniu</h3><p>Sytuacje, historia rozmów, plany, raporty, ustawienia i niewielka migawka dla widżetu na ekranie głównym są przechowywane lokalnie w aplikacji (oraz w kopiach zapasowych urządzenia zgodnie z ustawieniami iOS). Nie mamy do nich dostępu. Możesz usunąć sytuację w aplikacji albo usunąć aplikację, aby skasować wszystko.</p><h3>3. Co opuszcza Twoje urządzenie</h3><p>Gdy korzystasz z funkcji AI, aplikacja wysyła do naszego serwera pośredniczącego, który przekazuje to do API Anthropic:</p><ul><li>wiadomości, które piszesz, oraz wcześniejsze wiadomości tej rozmowy,</li><li>dane, które podajesz o sytuacji (np. opis, kogo dotyczy, temat) oraz nasze instrukcje dla AI,</li><li>język i wersję aplikacji.</li></ul><p>Serwer otrzymuje też <strong>losowy identyfikator urządzenia</strong> (generowany przez aplikację, przechowywany w Pęku kluczy iOS, niepowiązany z Twoim imieniem ani Apple ID), używany do egzekwowania limitu planu darmowego, a dla subskrybentów podpisaną przez Apple transakcję subskrypcji, którą weryfikujemy, by odblokować Premium (zawiera produkt i numer transakcji, bez danych płatniczych).</p><p>Serwer zapisuje wyłącznie liczniki (liczba zapytań na losowy identyfikator: do ok. 400 dni dla limitu planu darmowego, 2 dni dla dziennych limitów Premium). Nie zapisuje treści wiadomości. Cloudflare, który hostuje serwer, może przetwarzać techniczne dane żądań, takie jak adres IP, aby świadczyć usługę.</p><p>Jeśli korzystasz z formularza kontaktowego, Twoje imię, adres e-mail i wiadomość trafiają do nas przez dostawcę formularzy Formspree (USA) i służą wyłącznie do udzielenia odpowiedzi.</p><h3>4. Dostawca AI</h3><p>Anthropic przetwarza Twoje treści, aby generować odpowiedzi, jako nasz podmiot przetwarzający na podstawie warunków komercyjnych, z których wynika, że treści z API nie służą do trenowania jego modeli. Może przechowywać dane przez ograniczony czas w celu bezpieczeństwa i zapobiegania nadużyciom. Zobacz <a href=\"https://www.anthropic.com/privacy\" target=\"_blank\" rel=\"noopener\">anthropic.com/privacy</a>. Anthropic i Cloudflare działają w USA; transfery opierają się na zabezpieczeniach takich jak standardowe klauzule umowne lub EU–US Data Privacy Framework.</p><h3>5. Głos, kalendarz, powiadomienia</h3><ul><li><strong>Głos (Premium):</strong> zamiana mowy na tekst korzysta z Apple Speech (na urządzeniu lub na serwerach Apple, zależnie od języka i urządzenia); odpowiedzi głosowe generowane są na urządzeniu. Mikrofon działa tylko podczas nagrywania. Do nas trafia wyłącznie tekst, jeśli go wyślesz.</li><li><strong>Kalendarz:</strong> na Twoją prośbę dodawane jest krótkie wydarzenie (dostęp tylko do zapisu). <strong>Powiadomienia:</strong> przypomnienia są planowane lokalnie na urządzeniu.</li><li><strong>AI na urządzeniu:</strong> tam, gdzie jest dostępne, podpowiedzi może generować model Apple działający na urządzeniu, bez wysyłania danych.</li></ul><h3>6. Zakupy</h3><p>Płatności przetwarza Apple. Nigdy nie widzimy danych Twojej karty ani płatności.</p><h3>7. Podstawa prawna (RODO)</h3><p>Realizacja usługi, o którą prosisz (art. 6 ust. 1 lit. b) oraz nasz prawnie uzasadniony interes w zapewnieniu bezpieczeństwa usługi i zapobieganiu nadużywaniu limitów (art. 6 ust. 1 lit. f). Rozmowy mogą zawierać dane osobowe, które sam wpisujesz; prosimy, unikaj wrażliwych danych osób trzecich.</p><h3>8. Twoje prawa</h3><p>Możesz żądać dostępu, sprostowania, usunięcia, przenoszenia danych lub sprzeciwić się przetwarzaniu, a także złożyć skargę do organu ochrony danych (w Polsce: UODO). Ponieważ nie prowadzimy kont, większość Twoich danych jest pod Twoją kontrolą na urządzeniu. Liczniki na serwerze są powiązane tylko z losowym identyfikatorem, więc aby je usunąć, napisz do nas, a pomożemy, o ile to technicznie możliwe.</p><h3>9. Dzieci</h3><p>Aplikacja nie jest przeznaczona dla osób poniżej 18. roku życia i świadomie nie zbieramy ich danych.</p><h3>10. Zmiany i kontakt</h3><p>Politykę zaktualizujemy, gdy zmieni się aplikacja; data powyżej wskazuje najnowszą wersję. Pytania: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      support_doc: "<p>Chętnie pomożemy. Staramy się odpowiadać w ciągu kilku dni roboczych.</p><form class=\"contact-form\" action=\"https://formspree.io/f/xwvyljvj\" method=\"POST\"><input type=\"hidden\" name=\"_subject\" value=\"[ArgumentCoach] Support\"><input type=\"hidden\" name=\"app\" value=\"ArgumentCoach\"><input type=\"hidden\" name=\"_language\" value=\"pl\"><input type=\"text\" name=\"_gotcha\" tabindex=\"-1\" autocomplete=\"off\" style=\"display:none\"><label>Imię<input type=\"text\" name=\"name\" required autocomplete=\"name\"></label><label>Adres e-mail<input type=\"email\" name=\"email\" required autocomplete=\"email\"></label><label>Temat<select name=\"topic\" required><option value=\"\" disabled selected>Wybierz temat…</option><option value=\"Subskrypcja i płatności\">Subskrypcja i płatności</option><option value=\"Problem techniczny\">Problem techniczny</option><option value=\"Prywatność i dane\">Prywatność i dane</option><option value=\"Opinia i sugestie\">Opinia i sugestie</option><option value=\"Inne\">Inne</option></select></label><label>Wiadomość<textarea name=\"message\" rows=\"5\" required></textarea></label><button type=\"submit\" class=\"submit-btn\">Wyślij wiadomość →</button><p class=\"form-err\" hidden>Coś poszło nie tak. Spróbuj ponownie lub napisz do nas e-mailem.</p></form><p class=\"form-ok\" hidden>Wiadomość wysłana! Dziękujemy, odpowiemy w ciągu kilku dni roboczych.</p><p class=\"form-note\">Albo napisz bezpośrednio: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><div class=\"label\">Najczęstsze pytania</div><details><summary>Jak przywrócić zakupy?</summary><p>Otwórz Ustawienia w aplikacji i stuknij „Przywróć zakupy” (jest też na ekranie Premium). Użyj tego samego Apple ID, którym kupowano subskrypcję.</p></details><details><summary>Jak anulować subskrypcję?</summary><p>Na iPhonie: Ustawienia → Twoje imię → Subskrypcje → ArgumentCoach → Anuluj. Premium zachowujesz do końca opłaconego okresu.</p></details><details><summary>Jak uzyskać zwrot pieniędzy?</summary><p>Zwroty obsługuje Apple: wejdź na reportaproblem.apple.com, zaloguj się i wybierz zakup.</p></details><details><summary>Jak usunąć moje dane?</summary><p>Usuń sytuację w aplikacji albo usuń aplikację, aby skasować wszystkie dane na urządzeniu. W sprawie liczników na serwerze napisz do nas.</p></details><details><summary>Dlaczego osiągnięto limit planu darmowego?</summary><p>Plan darmowy obejmuje jeden pełny cykl (jedną sytuację) z ograniczoną liczbą wiadomości. Premium znosi te limity.</p></details><details><summary>Aplikacja pokazuje błąd albo nie odpowiada</summary><p>Sprawdź połączenie z internetem i zaktualizuj aplikację do najnowszej wersji w App Store. Jeśli problem nie znika, napisz do nas krótki opis.</p></details><details><summary>AI odpowiedziało w innym języku</summary><p>Odpowiada w języku Twojej ostatniej wiadomości. Pisz w języku, w którym chcesz dostać odpowiedź.</p></details><details><summary>Jestem w kryzysie</summary><p>ArgumentCoach nie jest usługą kryzysową. Natychmiast zadzwoń pod numer alarmowy 112 lub na telefon zaufania. W Polsce: 116 123 (dorośli), 116 111 (dzieci i młodzież).</p></details>",

      terms_doc: "<h3>1. Über ArgumentCoach</h3><p>ArgumentCoach („die App“, „wir“) ist eine iOS-App von Michał Karczewski (Polen), die dich auf schwierige Gespräche vorbereitet: Du besprichst die Situation, erhältst einen Gesprächsplan, übst ihn in einem Rollenspiel, in dem die KI die andere Seite spielt, und wertest aus, wie es lief. Die Antworten erzeugt eine KI (Claude von Anthropic). Mit der Nutzung der App stimmst du diesen Bedingungen zu.</p><h3>2. Für wen die App gedacht ist</h3><p>Die App richtet sich an Erwachsene (ab 18). Jüngere Personen nutzen sie nur gemeinsam mit einem Elternteil oder Erziehungsberechtigten.</p><h3>3. Keine Therapie und keine professionelle Beratung</h3><p>ArgumentCoach ist ein Werkzeug zur Selbsthilfe und zum Üben. Es ist <strong>keine</strong> Therapie und keine medizinische, rechtliche oder finanzielle Beratung, und die KI kann sich irren. Verstehe Vorschläge als Anregungen, nicht als Anweisungen. Bist du in Gefahr oder in einer Krise, ruf sofort den örtlichen Notruf (112) oder eine Krisenhotline an; die App zeigt Hilfenummern, wenn sie eine Krise erkennt.</p><h3>4. Kostenloser Plan und Premium</h3><ul><li><strong>Kostenlos:</strong> ein vollständiger Durchlauf (eine Situation) mit begrenzter Nachrichtenzahl, ohne Konto.</li><li><strong>Premium:</strong> automatisch verlängerndes Monats- oder Jahresabo (4,99 US-$ pro Monat oder 39,99 US-$ pro Jahr; Preise können je nach Land abweichen und enthalten ggf. Steuern). Es schaltet unbegrenzte Situationen, Sprachfunktionen und alle Themen frei. Es gibt keine kostenlose Testphase: Du bezahlst den Zeitraum mit der Kaufbestätigung.</li><li>Die Zahlung wird deiner Apple-ID belastet. Das Abo verlängert sich automatisch, sofern du es nicht mindestens 24 Stunden vor Ende des laufenden Zeitraums kündigst. Verwalten oder kündigen kannst du es in den iOS-Einstellungen → dein Name → Abonnements.</li><li>Erstattungen werden von Apple abgewickelt (reportaproblem.apple.com), gemäß den Regeln von Apple und deinen gesetzlichen Rechten.</li><li>Damit der Dienst fair und bezahlbar bleibt, hat Premium ein großzügiges tägliches Nachrichtenlimit.</li></ul><h3>5. Zulässige Nutzung</h3><ul><li>Nutze die App nicht für Rechtswidriges, nicht zur Planung von Schaden für dich oder andere und nicht, um jemanden zu belästigen.</li><li>Versuche nicht, Limits zu umgehen, den Dienst zu missbrauchen, zu überlasten oder zurückzuentwickeln.</li><li>Teile dein Abo nicht in einer Weise, die Apples Regeln nicht erlauben.</li></ul><h3>6. Deine Inhalte</h3><p>Was du schreibst, gehört dir. Du erlaubst uns, es ausschließlich zum Betrieb der App zu verarbeiten (einschließlich der Weitergabe an unseren KI-Anbieter zur Erzeugung von Antworten, siehe Datenschutz). Bitte gib keine sensiblen Angaben zu anderen Personen ein.</p><h3>7. Verfügbarkeit und Haftung</h3><p>Wir sorgen für einen stabilen Betrieb, die App wird jedoch „wie besehen“ bereitgestellt und kann sich ändern oder zeitweise nicht verfügbar sein. Soweit gesetzlich zulässig, haften wir nicht für Entscheidungen auf Grundlage von KI-Antworten. Deine zwingenden Verbraucherrechte und eine nicht ausschließbare Haftung bleiben unberührt.</p><h3>8. Apple, anwendbares Recht, Änderungen</h3><p>Zusätzlich gilt Apples <a href=\"https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\" target=\"_blank\" rel=\"noopener\">Standard-Endnutzerlizenz (EULA)</a>. Es gilt polnisches Recht, ohne dir den Verbraucherschutz deines Wohnsitzlandes zu entziehen. Wir können diese Bedingungen aktualisieren; das Datum oben zeigt die neueste Fassung, wesentliche Änderungen kündigen wir in der App oder hier an.</p><h3>9. Kontakt</h3><p>Fragen: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      privacy_doc: "<h3>Kurzfassung</h3><ul><li>Kein Konto, keine Werbung, kein Tracking, keine Analyse-SDKs, und wir verkaufen keine Daten.</li><li>Deine Situationen, Chats, Pläne und Berichte liegen auf deinem Gerät.</li><li>Zur Erstellung einer Antwort wird der gesendete Text von unserem KI-Anbieter (Anthropic) über unseren Proxy (Cloudflare) verarbeitet. Deine Gespräche speichern wir nicht auf einem Server.</li></ul><h3>1. Verantwortlicher</h3><p>Michał Karczewski, Polen. Kontakt: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><h3>2. Auf deinem Gerät gespeichert</h3><p>Situationen, Gesprächsverlauf, Pläne, Berichte, Einstellungen und ein kleiner Snapshot für das Home-Bildschirm-Widget werden lokal in der App gespeichert (und je nach iOS-Einstellungen in deinen Geräte-Backups). Wir haben darauf keinen Zugriff. Du kannst eine Situation in der App löschen oder die App löschen, um alles zu entfernen.</p><h3>3. Was dein Gerät verlässt</h3><p>Wenn du die KI-Funktionen nutzt, sendet die App Folgendes an unseren Proxy, der es an die API von Anthropic weiterleitet:</p><ul><li>die Nachrichten, die du schreibst, und die früheren Nachrichten dieses Gesprächs,</li><li>deine Angaben zur Situation (z. B. Beschreibung, um wen es geht, Thema) und unsere Anweisungen an die KI,</li><li>deine Sprache und die App-Version.</li></ul><p>Der Proxy erhält außerdem eine <strong>zufällige Geräte-ID</strong> (von der App erzeugt, im iOS-Schlüsselbund gespeichert, nicht mit deinem Namen oder deiner Apple-ID verknüpft) zur Durchsetzung des Limits im kostenlosen Plan sowie bei Abonnenten die von Apple signierte Abo-Transaktion, die wir zur Freischaltung von Premium prüfen (sie enthält Produkt und Transaktionsnummer, keine Zahlungsdaten).</p><p>Der Proxy speichert nur Zähler (Anzahl der Anfragen pro zufälliger ID: bis zu ca. 400 Tage für das Limit im kostenlosen Plan, 2 Tage für die Tageslimits von Premium). Nachrichteninhalte speichert er nicht. Cloudflare, das den Proxy hostet, kann technische Anfragedaten wie die IP-Adresse verarbeiten, um den Dienst zu betreiben.</p><p>Wenn du das Kontaktformular nutzt, werden dein Name, deine E-Mail-Adresse und deine Nachricht über den Formularanbieter Formspree (USA) an uns übermittelt und nur zur Beantwortung verwendet.</p><h3>4. KI-Anbieter</h3><p>Anthropic verarbeitet deine Inhalte zur Erstellung von Antworten als unser Auftragsverarbeiter nach seinen kommerziellen Bedingungen, wonach API-Inhalte nicht zum Training seiner Modelle verwendet werden. Daten können zeitlich begrenzt zu Sicherheits- und Missbrauchsschutzzwecken aufbewahrt werden. Siehe <a href=\"https://www.anthropic.com/privacy\" target=\"_blank\" rel=\"noopener\">anthropic.com/privacy</a>. Anthropic und Cloudflare sind in den USA tätig; Übermittlungen stützen sich auf Garantien wie Standardvertragsklauseln oder das EU-US Data Privacy Framework.</p><h3>5. Sprache, Kalender, Mitteilungen</h3><ul><li><strong>Sprache (Premium):</strong> Die Spracherkennung nutzt Apples Speech-Framework (auf dem Gerät oder auf Apple-Servern, je nach Sprache und Gerät); gesprochene Antworten werden auf deinem Gerät erzeugt. Das Mikrofon ist nur während der Aufnahme aktiv. Zu uns gelangt nur der resultierende Text, wenn du ihn sendest.</li><li><strong>Kalender:</strong> Auf deinen Wunsch wird ein kurzer Termin hinzugefügt (nur Schreibzugriff). <strong>Mitteilungen:</strong> Erinnerungen werden lokal auf deinem Gerät geplant.</li><li><strong>KI auf dem Gerät:</strong> Wo verfügbar, können Hinweise vom Apple-Modell auf deinem Gerät erzeugt werden, ohne dass Daten das Gerät verlassen.</li></ul><h3>6. Käufe</h3><p>Zahlungen verarbeitet Apple. Wir sehen nie deine Karten- oder Zahlungsdaten.</p><h3>7. Rechtsgrundlage (DSGVO)</h3><p>Erfüllung des von dir gewünschten Dienstes (Art. 6 Abs. 1 lit. b) sowie unser berechtigtes Interesse an der Sicherheit des Dienstes und dem Schutz vor Missbrauch der Limits (Art. 6 Abs. 1 lit. f). Gespräche können personenbezogene Angaben enthalten, die du selbst eingibst; bitte vermeide sensible Daten Dritter.</p><h3>8. Deine Rechte</h3><p>Du kannst Auskunft, Berichtigung, Löschung, Datenübertragbarkeit verlangen oder der Verarbeitung widersprechen und dich bei deiner Datenschutzbehörde beschweren (in Polen: UODO). Da wir keine Konten führen, liegt der Großteil deiner Daten in deiner Hand auf dem Gerät. Zähler auf dem Server sind nur mit einer zufälligen ID verknüpft; schreibe uns zur Löschung, wir helfen, soweit technisch möglich.</p><h3>9. Kinder</h3><p>Die App richtet sich nicht an Personen unter 18 Jahren, und wir erheben wissentlich keine Daten von ihnen.</p><h3>10. Änderungen und Kontakt</h3><p>Wir aktualisieren diese Erklärung, wenn sich die App ändert; das Datum oben zeigt die neueste Fassung. Fragen: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      support_doc: "<p>Wir helfen gern. Wir bemühen uns, innerhalb weniger Werktage zu antworten.</p><form class=\"contact-form\" action=\"https://formspree.io/f/xwvyljvj\" method=\"POST\"><input type=\"hidden\" name=\"_subject\" value=\"[ArgumentCoach] Support\"><input type=\"hidden\" name=\"app\" value=\"ArgumentCoach\"><input type=\"hidden\" name=\"_language\" value=\"de\"><input type=\"text\" name=\"_gotcha\" tabindex=\"-1\" autocomplete=\"off\" style=\"display:none\"><label>Dein Name<input type=\"text\" name=\"name\" required autocomplete=\"name\"></label><label>E-Mail-Adresse<input type=\"email\" name=\"email\" required autocomplete=\"email\"></label><label>Thema<select name=\"topic\" required><option value=\"\" disabled selected>Thema auswählen…</option><option value=\"Abonnement & Abrechnung\">Abonnement & Abrechnung</option><option value=\"Technisches Problem\">Technisches Problem</option><option value=\"Datenschutz & Daten\">Datenschutz & Daten</option><option value=\"Feedback & Vorschläge\">Feedback & Vorschläge</option><option value=\"Sonstiges\">Sonstiges</option></select></label><label>Nachricht<textarea name=\"message\" rows=\"5\" required></textarea></label><button type=\"submit\" class=\"submit-btn\">Nachricht senden →</button><p class=\"form-err\" hidden>Etwas ist schiefgelaufen. Bitte versuche es erneut oder schreibe uns per E-Mail.</p></form><p class=\"form-ok\" hidden>Nachricht gesendet! Danke, wir melden uns innerhalb weniger Werktage.</p><p class=\"form-note\">Oder schreibe direkt: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><div class=\"label\">Häufige Fragen</div><details><summary>Wie stelle ich meine Käufe wieder her?</summary><p>Öffne in der App die Einstellungen und tippe auf „Käufe wiederherstellen“ (auch auf dem Premium-Bildschirm). Verwende dieselbe Apple-ID wie beim Kauf.</p></details><details><summary>Wie kündige ich mein Abonnement?</summary><p>Auf dem iPhone: Einstellungen → dein Name → Abonnements → ArgumentCoach → Kündigen. Premium bleibt bis zum Ende des bezahlten Zeitraums aktiv.</p></details><details><summary>Wie bekomme ich eine Erstattung?</summary><p>Erstattungen wickelt Apple ab: Gehe auf reportaproblem.apple.com, melde dich an und wähle den Kauf aus.</p></details><details><summary>Wie lösche ich meine Daten?</summary><p>Lösche eine Situation in der App oder lösche die App, um alle Daten auf deinem Gerät zu entfernen. Bei Fragen zu Zählern auf dem Server schreibe uns.</p></details><details><summary>Warum habe ich das kostenlose Limit erreicht?</summary><p>Der kostenlose Plan umfasst einen vollständigen Durchlauf (eine Situation) mit begrenzter Nachrichtenzahl. Premium hebt diese Limits auf.</p></details><details><summary>Die App zeigt einen Fehler oder antwortet nicht</summary><p>Prüfe deine Internetverbindung und aktualisiere die App im App Store. Wenn das Problem bleibt, schreibe uns eine kurze Beschreibung.</p></details><details><summary>Die KI hat in einer anderen Sprache geantwortet</summary><p>Sie antwortet in der Sprache deiner letzten Nachricht. Schreibe in der Sprache, in der du die Antwort haben möchtest.</p></details><details><summary>Ich bin in einer Krise</summary><p>ArgumentCoach ist kein Krisendienst. Ruf sofort den Notruf 112 oder eine Krisenhotline an. In Deutschland: Telefonseelsorge 0800 111 0 111 oder 0800 111 0 222.</p></details>",

      terms_doc: "<h3>1. Über ArgumentCoach</h3><p>ArgumentCoach („die App“, „wir“) ist eine iOS-App von Michał Karczewski (Polen), die dich auf schwierige Gespräche vorbereitet: Du besprichst die Situation, erhältst einen Gesprächsplan, übst ihn in einem Rollenspiel, in dem die KI die andere Seite spielt, und wertest aus, wie es lief. Die Antworten erzeugt eine KI (Claude von Anthropic). Mit der Nutzung der App stimmst du diesen Bedingungen zu.</p><h3>2. Für wen die App gedacht ist</h3><p>Die App richtet sich an Erwachsene (ab 18). Jüngere Personen nutzen sie nur gemeinsam mit einem Elternteil oder Erziehungsberechtigten.</p><h3>3. Keine Therapie und keine professionelle Beratung</h3><p>ArgumentCoach ist ein Werkzeug zur Selbsthilfe und zum Üben. Es ist <strong>keine</strong> Therapie und keine medizinische, rechtliche oder finanzielle Beratung, und die KI kann sich irren. Verstehe Vorschläge als Anregungen, nicht als Anweisungen. Bist du in Gefahr oder in einer Krise, ruf sofort den örtlichen Notruf (112) oder eine Krisenhotline an; die App zeigt Hilfenummern, wenn sie eine Krise erkennt.</p><h3>4. Kostenloser Plan und Premium</h3><ul><li><strong>Kostenlos:</strong> ein vollständiger Durchlauf (eine Situation) mit begrenzter Nachrichtenzahl, ohne Konto.</li><li><strong>Premium:</strong> automatisch verlängerndes Monats- oder Jahresabo (4,99 US-$ pro Monat oder 39,99 US-$ pro Jahr; Preise können je nach Land abweichen und enthalten ggf. Steuern). Es schaltet unbegrenzte Situationen, Sprachfunktionen und alle Themen frei. Es gibt keine kostenlose Testphase: Du bezahlst den Zeitraum mit der Kaufbestätigung.</li><li>Die Zahlung wird deiner Apple-ID belastet. Das Abo verlängert sich automatisch, sofern du es nicht mindestens 24 Stunden vor Ende des laufenden Zeitraums kündigst. Verwalten oder kündigen kannst du es in den iOS-Einstellungen → dein Name → Abonnements.</li><li>Erstattungen werden von Apple abgewickelt (reportaproblem.apple.com), gemäß den Regeln von Apple und deinen gesetzlichen Rechten.</li><li>Damit der Dienst fair und bezahlbar bleibt, hat Premium ein großzügiges tägliches Nachrichtenlimit.</li></ul><h3>5. Zulässige Nutzung</h3><ul><li>Nutze die App nicht für Rechtswidriges, nicht zur Planung von Schaden für dich oder andere und nicht, um jemanden zu belästigen.</li><li>Versuche nicht, Limits zu umgehen, den Dienst zu missbrauchen, zu überlasten oder zurückzuentwickeln.</li><li>Teile dein Abo nicht in einer Weise, die Apples Regeln nicht erlauben.</li></ul><h3>6. Deine Inhalte</h3><p>Was du schreibst, gehört dir. Du erlaubst uns, es ausschließlich zum Betrieb der App zu verarbeiten (einschließlich der Weitergabe an unseren KI-Anbieter zur Erzeugung von Antworten, siehe Datenschutz). Bitte gib keine sensiblen Angaben zu anderen Personen ein.</p><h3>7. Verfügbarkeit und Haftung</h3><p>Wir sorgen für einen stabilen Betrieb, die App wird jedoch „wie besehen“ bereitgestellt und kann sich ändern oder zeitweise nicht verfügbar sein. Soweit gesetzlich zulässig, haften wir nicht für Entscheidungen auf Grundlage von KI-Antworten. Deine zwingenden Verbraucherrechte und eine nicht ausschließbare Haftung bleiben unberührt.</p><h3>8. Apple, anwendbares Recht, Änderungen</h3><p>Zusätzlich gilt Apples <a href=\"https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\" target=\"_blank\" rel=\"noopener\">Standard-Endnutzerlizenz (EULA)</a>. Es gilt polnisches Recht, ohne dir den Verbraucherschutz deines Wohnsitzlandes zu entziehen. Wir können diese Bedingungen aktualisieren; das Datum oben zeigt die neueste Fassung, wesentliche Änderungen kündigen wir in der App oder hier an.</p><h3>9. Kontakt</h3><p>Michał Karczewski, USt-IdNr./NIP: PL9442203727. Fragen: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      privacy_doc: "<h3>Kurzfassung</h3><ul><li>Kein Konto, keine Werbung, kein Tracking, keine Analyse-SDKs, und wir verkaufen keine Daten.</li><li>Deine Situationen, Chats, Pläne und Berichte liegen auf deinem Gerät.</li><li>Zur Erstellung einer Antwort wird der gesendete Text von unserem KI-Anbieter (Anthropic) über unseren Proxy (Cloudflare) verarbeitet. Deine Gespräche speichern wir nicht auf einem Server.</li></ul><h3>1. Verantwortlicher</h3><p>Michał Karczewski (Einzelunternehmer), Polen, USt-IdNr./NIP: PL9442203727. Kontakt: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><h3>2. Auf deinem Gerät gespeichert</h3><p>Situationen, Gesprächsverlauf, Pläne, Berichte, Einstellungen und ein kleiner Snapshot für das Home-Bildschirm-Widget werden lokal in der App gespeichert (und je nach iOS-Einstellungen in deinen Geräte-Backups). Wir haben darauf keinen Zugriff. Du kannst eine Situation in der App löschen oder die App löschen, um alles zu entfernen.</p><h3>3. Was dein Gerät verlässt</h3><p>Wenn du die KI-Funktionen nutzt, sendet die App Folgendes an unseren Proxy, der es an die API von Anthropic weiterleitet:</p><ul><li>die Nachrichten, die du schreibst, und die früheren Nachrichten dieses Gesprächs,</li><li>deine Angaben zur Situation (z. B. Beschreibung, um wen es geht, Thema) und unsere Anweisungen an die KI,</li><li>deine Sprache und die App-Version.</li></ul><p>Der Proxy erhält außerdem eine <strong>zufällige Geräte-ID</strong> (von der App erzeugt, im iOS-Schlüsselbund gespeichert, nicht mit deinem Namen oder deiner Apple-ID verknüpft) zur Durchsetzung des Limits im kostenlosen Plan sowie bei Abonnenten die von Apple signierte Abo-Transaktion, die wir zur Freischaltung von Premium prüfen (sie enthält Produkt und Transaktionsnummer, keine Zahlungsdaten).</p><p>Der Proxy speichert nur Zähler (Anzahl der Anfragen pro zufälliger ID: bis zu ca. 400 Tage für das Limit im kostenlosen Plan, 2 Tage für die Tageslimits von Premium). Nachrichteninhalte speichert er nicht. Cloudflare, das den Proxy hostet, kann technische Anfragedaten wie die IP-Adresse verarbeiten, um den Dienst zu betreiben.</p><p>Wenn du das Kontaktformular nutzt, werden dein Name, deine E-Mail-Adresse und deine Nachricht über den Formularanbieter Formspree (USA) an uns übermittelt und nur zur Beantwortung verwendet.</p><h3>4. KI-Anbieter</h3><p>Anthropic verarbeitet deine Inhalte zur Erstellung von Antworten als unser Auftragsverarbeiter nach seinen kommerziellen Bedingungen, wonach API-Inhalte nicht zum Training seiner Modelle verwendet werden. Daten können zeitlich begrenzt zu Sicherheits- und Missbrauchsschutzzwecken aufbewahrt werden. Siehe <a href=\"https://www.anthropic.com/privacy\" target=\"_blank\" rel=\"noopener\">anthropic.com/privacy</a>. Anthropic und Cloudflare sind in den USA tätig; Übermittlungen stützen sich auf Garantien wie Standardvertragsklauseln oder das EU-US Data Privacy Framework.</p><h3>5. Sprache, Kalender, Mitteilungen</h3><ul><li><strong>Sprache (Premium):</strong> Die Spracherkennung nutzt Apples Speech-Framework (auf dem Gerät oder auf Apple-Servern, je nach Sprache und Gerät); gesprochene Antworten werden auf deinem Gerät erzeugt. Das Mikrofon ist nur während der Aufnahme aktiv. Zu uns gelangt nur der resultierende Text, wenn du ihn sendest.</li><li><strong>Kalender:</strong> Auf deinen Wunsch wird ein kurzer Termin hinzugefügt (nur Schreibzugriff). <strong>Mitteilungen:</strong> Erinnerungen werden lokal auf deinem Gerät geplant.</li><li><strong>KI auf dem Gerät:</strong> Wo verfügbar, können Hinweise vom Apple-Modell auf deinem Gerät erzeugt werden, ohne dass Daten das Gerät verlassen.</li></ul><h3>6. Käufe</h3><p>Zahlungen verarbeitet Apple. Wir sehen nie deine Karten- oder Zahlungsdaten.</p><h3>7. Rechtsgrundlage (DSGVO)</h3><p>Erfüllung des von dir gewünschten Dienstes (Art. 6 Abs. 1 lit. b) sowie unser berechtigtes Interesse an der Sicherheit des Dienstes und dem Schutz vor Missbrauch der Limits (Art. 6 Abs. 1 lit. f). Gespräche können personenbezogene Angaben enthalten, die du selbst eingibst; bitte vermeide sensible Daten Dritter.</p><h3>8. Deine Rechte</h3><p>Du kannst Auskunft, Berichtigung, Löschung, Datenübertragbarkeit verlangen oder der Verarbeitung widersprechen und dich bei deiner Datenschutzbehörde beschweren (in Polen: UODO). Da wir keine Konten führen, liegt der Großteil deiner Daten in deiner Hand auf dem Gerät. Zähler auf dem Server sind nur mit einer zufälligen ID verknüpft; schreibe uns zur Löschung, wir helfen, soweit technisch möglich.</p><h3>9. Kinder</h3><p>Die App richtet sich nicht an Personen unter 18 Jahren, und wir erheben wissentlich keine Daten von ihnen.</p><h3>10. Änderungen und Kontakt</h3><p>Wir aktualisieren diese Erklärung, wenn sich die App ändert; das Datum oben zeigt die neueste Fassung. Fragen: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p>",
      support_doc: "<p>Wir helfen gern. Wir bemühen uns, innerhalb weniger Werktage zu antworten.</p><form class=\"contact-form\" action=\"https://formspree.io/f/xwvyljvj\" method=\"POST\"><input type=\"hidden\" name=\"_subject\" value=\"[ArgumentCoach] Support\"><input type=\"hidden\" name=\"app\" value=\"ArgumentCoach\"><input type=\"hidden\" name=\"_language\" value=\"de\"><input type=\"text\" name=\"_gotcha\" tabindex=\"-1\" autocomplete=\"off\" style=\"display:none\"><label>Dein Name<input type=\"text\" name=\"name\" required autocomplete=\"name\"></label><label>E-Mail-Adresse<input type=\"email\" name=\"email\" required autocomplete=\"email\"></label><label>Thema<select name=\"topic\" required><option value=\"\" disabled selected>Thema auswählen…</option><option value=\"Abonnement & Abrechnung\">Abonnement & Abrechnung</option><option value=\"Technisches Problem\">Technisches Problem</option><option value=\"Datenschutz & Daten\">Datenschutz & Daten</option><option value=\"Feedback & Vorschläge\">Feedback & Vorschläge</option><option value=\"Sonstiges\">Sonstiges</option></select></label><label>Nachricht<textarea name=\"message\" rows=\"5\" required></textarea></label><button type=\"submit\" class=\"submit-btn\">Nachricht senden →</button><p class=\"form-err\" hidden>Etwas ist schiefgelaufen. Bitte versuche es erneut oder schreibe uns per E-Mail.</p></form><p class=\"form-ok\" hidden>Nachricht gesendet! Danke, wir melden uns innerhalb weniger Werktage.</p><p class=\"form-note\">Oder schreibe direkt: <a href=\"mailto:moodshift.coach@gmail.com\">moodshift.coach@gmail.com</a></p><div class=\"label\">Häufige Fragen</div><details><summary>Wie stelle ich meine Käufe wieder her?</summary><p>Öffne in der App die Einstellungen und tippe auf „Käufe wiederherstellen“ (auch auf dem Premium-Bildschirm). Verwende dieselbe Apple-ID wie beim Kauf.</p></details><details><summary>Wie kündige ich mein Abonnement?</summary><p>Auf dem iPhone: Einstellungen → dein Name → Abonnements → ArgumentCoach → Kündigen. Premium bleibt bis zum Ende des bezahlten Zeitraums aktiv.</p></details><details><summary>Wie bekomme ich eine Erstattung?</summary><p>Erstattungen wickelt Apple ab: Gehe auf reportaproblem.apple.com, melde dich an und wähle den Kauf aus.</p></details><details><summary>Wie lösche ich meine Daten?</summary><p>Lösche eine Situation in der App oder lösche die App, um alle Daten auf deinem Gerät zu entfernen. Bei Fragen zu Zählern auf dem Server schreibe uns.</p></details><details><summary>Warum habe ich das kostenlose Limit erreicht?</summary><p>Der kostenlose Plan umfasst einen vollständigen Durchlauf (eine Situation) mit begrenzter Nachrichtenzahl. Premium hebt diese Limits auf.</p></details><details><summary>Die App zeigt einen Fehler oder antwortet nicht</summary><p>Prüfe deine Internetverbindung und aktualisiere die App im App Store. Wenn das Problem bleibt, schreibe uns eine kurze Beschreibung.</p></details><details><summary>Die KI hat in einer anderen Sprache geantwortet</summary><p>Sie antwortet in der Sprache deiner letzten Nachricht. Schreibe in der Sprache, in der du die Antwort haben möchtest.</p></details><details><summary>Ich bin in einer Krise</summary><p>ArgumentCoach ist kein Krisendienst. Ruf sofort den Notruf 112 oder eine Krisenhotline an. In Deutschland: Telefonseelsorge 0800 111 0 111 oder 0800 111 0 222.</p></details>",

  var TABS = ['terms', 'privacy', 'support'];
  var LANGS = ['en', 'pl', 'de'];
  var STORE = 'ac_lang';

  function safeGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }

  function detectLang() {
    var q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
    if (LANGS.indexOf(q) > -1) return q;
    var s = safeGet(STORE);
    if (LANGS.indexOf(s) > -1) return s;
    var n = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return LANGS.indexOf(n) > -1 ? n : 'en';
  }

  function currentTab() {
    var h = location.hash.replace('#', '').toLowerCase();
    return TABS.indexOf(h) > -1 ? h : 'terms';
  }

  function setLang(lang, persist) {
    var d = T[lang] || T.en;
    document.documentElement.lang = lang;
    document.title = d.doc_title;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (d[key] != null) el.textContent = d[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
      var key = el.getAttribute('data-i18n-html');
      if (d[key] != null) el.innerHTML = d[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
      var key = el.getAttribute('data-i18n-html');
      if (d[key] != null) el.innerHTML = d[key];
    });
    document.querySelectorAll('#langs .pill').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    document.getElementById('langs').setAttribute('aria-label', d.lang_label);
    if (persist) safeSet(STORE, lang);
  }

  function setTab(tab, focus) {
    TABS.forEach(function (t) {
      var on = t === tab;
      var btn = document.getElementById('tab-' + t);
      btn.setAttribute('aria-selected', String(on));
      btn.tabIndex = on ? 0 : -1;
      document.getElementById('panel-' + t).hidden = !on;
      if (on && focus) btn.focus();
    });
  }

  var lang = detectLang();
  setLang(lang, false);
  setTab(currentTab(), false);

  document.getElementById('langs').addEventListener('click', function (e) {
    var b = e.target.closest('.pill');
    if (!b) return;
    lang = b.dataset.lang;
    setLang(lang, true);
    try {
      var url = new URL(location.href);
      url.searchParams.set('lang', lang);
      history.replaceState(null, '', url.pathname + url.search + location.hash);
    } catch (err) { /* sandboxed preview: URL cannot be changed, page still works */ }
  });

  // The visible tab is kept in a variable, so the page works even when the
  // URL cannot be changed (sandboxed previews, blob/srcdoc pages).
  var activeTab = currentTab();

  function goTab(tab, focus) {
    activeTab = tab;
    setTab(tab, focus);
    try {
      history.replaceState(null, '', location.pathname + location.search + '#' + tab);
    } catch (err) { /* ignore */ }
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.pill');
    if (!b) return;
    goTab(b.dataset.tab, false);
  });

  document.getElementById('tabs').addEventListener('keydown', function (e) {
    var i = TABS.indexOf(activeTab);
    if (e.key === 'ArrowRight') i = (i + 1) % TABS.length;
    else if (e.key === 'ArrowLeft') i = (i + TABS.length - 1) % TABS.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = TABS.length - 1;
    else return;
    e.preventDefault();
    goTab(TABS[i], true);
  });

  window.addEventListener('hashchange', function () {
    activeTab = currentTab();
    setTab(activeTab, false);
  });

        f.nextElementSibling.hidden = false;
      })
